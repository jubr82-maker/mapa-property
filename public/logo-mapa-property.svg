<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" width="320" height="160" role="img" aria-label="MAPA Property">
  <title>MAPA Property</title>
  <desc>Logo officiel MAPA Property : MAPA en haut, fine ligne doree copper centree, PROPERTY en dessous, le tout aligne verticalement.</desc>

  <defs>
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700&amp;display=swap');
      .mapa-main {
        font-family: 'Big Shoulders Display', Impact, 'Arial Black', sans-serif;
        font-weight: 700;
        font-size: 72px;
        fill: #3D4F63;
        letter-spacing: 4px;
      }
      .mapa-sub {
        font-family: 'Big Shoulders Display', Impact, 'Arial Black', sans-serif;
        font-weight: 600;
        font-size: 22px;
        fill: #3D4F63;
        letter-spacing: 14px;
      }
    </style>
  </defs>

  <!-- MAPA -->
  <text x="160" y="80" class="mapa-main" text-anchor="middle">MAPA</text>

  <!-- Ligne doree copper -->
  <line x1="80" y1="100" x2="240" y2="100" stroke="#B8865A" stroke-width="1.4"/>

  <!-- PROPERTY -->
  <text x="167" y="128" class="mapa-sub" text-anchor="middle">PROPERTY</text>
</svg>
